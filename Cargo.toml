[package]
name = "gqls-cli"  # crates.io name (`gqls` is taken); the binary is still `gqls`
version = "0.26.1"
edition = "2021"
rust-version = "1.82"  # `Option::is_none_or`
description = "Fuzzy search over a GraphQL schema (SDL, introspection JSON, or a live endpoint), plus a field-to-resolver jump."
license = "MIT"
repository = "https://github.com/dpep/gqls"
homepage = "https://github.com/dpep/gqls"
documentation = "https://github.com/dpep/gqls"
readme = "README.md"
keywords = ["graphql", "schema", "search", "cli"]
categories = ["command-line-utilities"]

# Keep the lib named `gqls` even though the crate publishes as `gqls-cli`, so
# `main.rs` (and any dependent) still says `gqls::…`.
[lib]
name = "gqls"

[[bin]]
name = "gqls"
path = "src/main.rs"

# Allow-by-default upstream. `pub` on an item inside a private module is
# reachable from nowhere, yet `pub` is exactly what makes the dead_code lint
# skip an item — so it costs API surface and buys blindness.
[lints.rust]
unreachable_pub = "warn"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
graphql-parser = "0.4"
serde = { version = "1", features = ["derive"] }
# preserve_order: a drafted variables skeleton follows the schema's field order,
# which puts the required fields where the schema put them. Sorted, the block
# stops matching the `fields` listing an explanation prints for the same type.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
ureq = { version = "2", features = ["json"] }  # URL introspection

# Parallel fuzzy scoring scan.
rayon = "1"
terminal_size = "0.4"
# Column widths. `.chars().count()` is Unicode scalars, which is the terminal's
# column count only for ASCII — CJK is two columns per scalar and an emoji ZWJ
# sequence is many scalars and one glyph.
unicode-width = "0.2"

[dev-dependencies]
# Integration tests parse drafted operations back, so `--example` output is
# checked against a real GraphQL grammar rather than string equality. Same
# versions as above, so nothing extra is compiled.
graphql-parser = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
